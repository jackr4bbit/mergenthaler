{% extends "internal/base.html" %}
{% import "internal/post-card.html" as card %}

{% block title %}#{{tag}}{% endblock %}

{% block content %}
<section class="container" style="margin-top: 80px;">
<div class="section-heading reveal">
    <h2>Posts tagged <span id="category-name">#{{tag}}</span></h2>
</div>

<div class="post-grid">
    {% for post in posts %}
        {{ card.card(post, site, now) }}
    {% endfor %}
</div>
</section>
{% endblock %}
